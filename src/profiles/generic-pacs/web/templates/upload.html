<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; }
        .container { max-width: 600px; margin: 40px auto; padding: 20px; background-color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1f4e79; }
        .back { display: inline-block; margin-bottom: 10px; color: #007bff; text-decoration: none; }
        form { text-align: center; margin-top: 20px; }
        input[type=file] { margin: 10px 0; }
        button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { margin-top: 20px; text-align: center; color: #1f4e79; }
    </style>
    {{ fingerprint_seam|safe }}
</head>
<body>
    <div class="container">
        <a class="back" href="{{ routes.console }}">&larr; Console</a>
        <h1>Upload Studies</h1>
        <form action="{{ routes.upload }}" method="post" enctype="multipart/form-data">
            <p>Select up to {{ max_files }} DICOM Part-10 files.</p>
            <input type="file" name="dicomFiles" accept=".dcm,application/dicom" multiple required>
            <br>
            <button type="submit">Upload</button>
        </form>
        {% if message %}<p class="message">{{ message }}</p>{% endif %}
    </div>
</body>
</html>
