<!DOCTYPE html>
<html class="hydrated"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Synapse Sign-On</title>
    <link href="{{ url_for('static', filename='synapse/head-third-party.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='synapse/head-app.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='synapse/app.css') }}" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='synapse/OpenSansFonts.css') }}">
</head>

<body lang="en" class="sw-dark">
    <nav class="navbar navbar-inverse navbar-fixed-top" style="position:fixed;">
        <div class="navbar-header">
            <span class="navbar-brand">
                <img src="{{ url_for('static', filename='synapse/logo-fujifilm.png') }}">
            </span>
        </div>
    </nav>
    <div class="center-parent" id="center-parent" style="padding-top: 173.75px;">
        <div class="container">

            <!-- License Expiration Warning -->
            <div class="row">
                <div class="col-sm-8 col-xs-12 col-sm-offset-2">
                    <div style="display:none">
                        <div class="alert alert-warning">
                            <img src="{{ url_for('static', filename='synapse/alert_icon_yellow.png') }}" style="width:20px;height:20px;">
                            <strong><span class="license-warning">  </span></strong>
                            <a class="btn btn-primary" style="margin-left:2.0em" href="{{ renew_url }}">Request New License</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Logon Error Notice -->
            <div class="row">
                <div class="col-sm-8 col-xs-12 col-sm-offset-2">
                    <div style="display:none">
                        <div class="alert alert-danger">
                            <strong>Error:</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Section -->
            <div class="row">
                <div class="col-sm-8 col-xs-10 col-xs-offset-1 col-sm-offset-2">
                    <div class="row well login-well">

                        <!-- Logo and License Info -->
                        <div class="col-md-6">

                            <!-- Logo (for wide viewports)-->
                            <div class="hidden-xs hidden-sm" style="height:100px; margin: 40px 20px 0px 20px;">
                                <svg xmlns="http://www.w3.org/2000/svg" class="logo" viewBox="0 0 130 28" preserveAspectRatio="xMinYMin meet">

                                    <path class="stroke" d="M 76.655 12.78 l -1.063 -2.363 c -1.35 0.005 -2.606 0.05 -3.78 0.134 c -0.728 0.055 -1.42 0.12 -2.085 0.2 c -3.72 0.46 -6.497 1.4 -8.665 2.908 c -2.053 1.427 -3.562 3.354 -4.802 5.858 h 3.744 c 3.55 -7.02 14.07 -6.718 16.65 -6.732"></path>
                                    <text x="0" y="26" fill="#777" font-size=".5em">{{ synapse_version }}</text>
                                </svg>
                            </div>

                            <!-- Logo (for narrow viewports)-->
                            <div class="hidden-md hidden-lg" style="height:120px; margin: 40px 20px 0px 20px;">
                                <svg xmlns="http://www.w3.org/2000/svg" class="logo" height="100%" width="100%" viewBox="0 0 130 28" preserveAspectRatio="xMinYMid meet">
                                    <path class="letters" d="M 14.096 5.92 c -0.268 -3.254 -2.915 -4.105 -5.992 -4.105 s -5.402 1.2 -5.402 3.358 c 0 2.48 2.326 3.067 6.98 3.84 c 3.477 0.588 6.955 1.388 6.955 5.04 c 0 4.668 -4.25 5.947 -7.97 5.947 C 3.824 20 0.293 18.346 0 13.228 h 1.98 c 0.347 4 3.022 4.96 6.686 4.96 c 2.862 0 5.83 -0.773 5.83 -3.788 c 0 -2.906 -3.477 -3.253 -6.953 -3.813 c -4.547 -0.72 -6.98 -2 -6.98 -5.066 C 0.563 1.36 4.413 0 8.103 0 c 3.905 0 7.837 1.386 7.97 5.92 h -1.978 Z m 10.27 5.6 L 15.784 0.48 h 2.566 l 7.007 9.067 L 32.365 0.48 h 2.568 l -8.586 11.04 v 8 h -1.98 Z M 36.67 0.48 h 2.38 L 52.4 16.746 h 0.053 V 0.48 h 1.98 v 19.04 h -2.3 L 38.703 3.255 h -0.054 V 19.52 h -1.98 Z m 72.912 5.44 c -0.268 -3.254 -2.916 -4.105 -5.992 -4.105 c -3.075 0 -5.402 1.2 -5.402 3.358 c 0 2.48 2.327 3.067 6.98 3.84 c 3.48 0.588 6.955 1.388 6.955 5.04 c 0 4.668 -4.254 5.947 -7.97 5.947 c -4.843 0 -8.372 -1.654 -8.667 -6.772 h 1.98 c 0.348 4 3.022 4.96 6.687 4.96 c 2.862 0 5.83 -0.773 5.83 -3.788 c 0 -2.906 -3.477 -3.253 -6.953 -3.813 c -4.547 -0.72 -6.98 -2 -6.98 -5.066 c 0 -4.16 3.85 -5.52 7.54 -5.52 c 3.905 0 7.838 1.39 7.973 5.92 h -1.98 Z M 88.098 0.48 H 77.803 v 19.04 h 1.978 V 2.292 h 8.05 c 2.277 0 3.88 0.828 3.88 3.68 c 0 2.214 -1.205 4.712 -4.53 4.657 H 80.93 l 0.803 1.845 h 5.47 c 4.254 0 6.653 -2.903 6.653 -6.505 C 93.85 1.95 91.04 0.48 88.1 0.48 M 71.637 15.092 l 1.953 4.423 h 2.3 l -2.972 -6.53 Z m -10.575 -1.437 L 66.048 2.45 l 3.68 8.3 c 0.663 -0.082 1.356 -0.148 2.083 -0.2 L 67.23 0.476 h -2.3 l -8.666 19.04 c 1.24 -2.505 2.75 -4.433 4.803 -5.86 m 55.507 4.05 V 2.294 h 13.214 V 0.48 h -15.193 v 19.04 H 130 v -1.813 Z m 12.73 -7.146 V 8.75 h -11.97 l 0.81 1.813 Z"></path>
                                    <path class="stroke" d="M 76.655 12.78 l -1.063 -2.363 c -1.35 0.005 -2.606 0.05 -3.78 0.134 c -0.728 0.055 -1.42 0.12 -2.085 0.2 c -3.72 0.46 -6.497 1.4 -8.665 2.908 c -2.053 1.427 -3.562 3.354 -4.802 5.858 h 3.744 c 3.55 -7.02 14.07 -6.718 16.65 -6.732"></path>
                                    <text x="0" y="26" fill="#777" font-size=".5em">{{ synapse_version }}</text>
                                </svg>
                            </div>
                            <!-- End Logo -->
                            <!-- License Info -->
                            <div class="row" style="padding-top:5px">
                                <div class="text-center">
                                    <div>
                                        <h6 style="margin-bottom:1.1em">
                                            Licensed to:
                                        </h6>
                                    </div>
                                    <div style="margin-top:0.3em;margin-bottom:0.2em;word-wrap:break-word">
                                        <h5>
                                            {% for line in license_lines %}<label>{{ line }}</label><br>
                                            {% endfor %}
                                        </h5>
                                    </div>
                                    <div style="margin-bottom:0.2em;">
                                        <!-- License issued date -->
                                        <h6 style="margin-bottom:0.2em">
                                            <span>License issued:&nbsp;</span>
                                            <span id="licenseIssuedDateID">{{ license_issued }}</span>
                                        </h6>

                                        <!-- License expiration date -->
                                        <h6 style="margin-bottom:1.5em;visibility:hidden">
                                            <span class="" style="color:{ExpirationDateColor}">License expires:&nbsp;</span>
                                            <span class="" style="color:{ExpirationDateColor}" id="licenseExpirationDateID">Invalid date</span>
                                        </h6>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- Login Form -->
                        <div class="col-md-6">
                            <form name="form" id="form" method="post" action="{{ login_url }}">
                                <div class="shadow-box" style="display: block;">
                                    <input id="antiForgery" type="hidden" value="{{ antiforgery_token }}" name="idsrv.xsrf">
                                    <div class="form-group">
                                        <label for="username">Username</label>
                                        <input required="" title="This field is required." name="username" autofocus="" id="username" type="text" class="form-control" placeholder="Username" maxlength="100" autocomplete="off" list="autocompleteOff">
                                    </div>
                                    <div class="form-group">
                                        <label for="password">Password</label>
                                        <div class="alt-password">
                                            <input required="" title="This field is required." id="password" name="password" type="password" class="form-control" placeholder="Password" maxlength="100" autocomplete="off" list="autocompleteOff">
                                            <i id="pass-status" class="fa fa-eye" aria-hidden="true"></i>
                                        </div>
                                        <input type="hidden" id="publicKey" name="publicKey" value="">
                                        <input type="hidden" id="encryptedpassword" name="encryptedpassword">
                                    </div>
                                    <!--
                                    <div class="form-group login-remember" ng-show="model.allowRememberMe">
                                        <label for="rememberMe">
                                            <input type="checkbox" id="rememberMe" name="rememberMe" ng-model="model.rememberMe" value="true">
                                            <strong>Remember Me</strong>
                                        </label>
                                    </div>
                                    -->
                                    <div style="display:block">
                                        <a href="{{ winlogin_url }}" class="btn btn-link">Log in with Windows instead</a>
                                    </div>
                                    <br>
                                    <br>
                                    <hr style="border-top-color:gray">
                                    <div class="form-group pull-right">
                                        <button id="login-btn" class="btn btn-primary" disabled="">Log In</button>
                                    </div>
                                    <p><a href="{{ forgot_url }}" class="btn btn-link">Forgot password</a></p>
                                    <div class="additional-links">
                                        <ul class="list-unstyled"></ul>
                                        <!-- hide this HR if there is any external provider link -->
                                        <div class="closing-hr" style="display: none;">
                                            <hr style="color: #1C2A2A; background: #1c2a2a; height: 1px; border: 0; margin: 0;">
                                            <hr style="color: #2E403F; background: #2E403F; height: 1px; border: 0; margin: 0; margin-bottom: 12px;">
                                        </div>
                                    </div>
                                </div>
                                <div class="external-providers" style="display: none;">
                                    <hr style="color: #1C2A2A; background: #1c2a2a; height: 1px; border: 0; margin: 0;">
                                    <hr style="color: #2E403F; background: #2E403F; height: 1px; border: 0; margin: 0; margin-bottom: 12px;">
                                    <h4><small>External Log In</small></h4>
                                    <hr style="color: #1C2A2A; background: #1c2a2a; height: 1px; border: 0; margin: 0;">
                                    <hr style="color: #2E403F; background: #2E403F; height: 1px; border: 0; margin: 0; margin-bottom: 12px;">
                                    <ul class="list-unstyled"></ul>
                                    <hr style="color: #1C2A2A; background: #1c2a2a; height: 1px; border: 0; margin: 0;">
                                    <hr style="color: #2E403F; background: #2E403F; height: 1px; border: 0; margin: 0; margin-bottom: 12px;">
                                </div>
                            </form>
                        </div>
                        <!-- End Login Form -->

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Copyright Notice -->
    <div class="row">
        <div class="col-sm-12">
            <h4 class="text-center"><small>{{ copyright }}</small></h4>
        </div>
    </div>

    <!-- Inject scripts for Synapse client-side date/time formatting -->
    <script nonce="{{ csp_nonce }}"> var synapseDateTimeFormatCulture='en';</script>
<script src="{{ url_for('static', filename='synapse/moment.min.js') }}"></script>
<script src="{{ url_for('static', filename='synapse/LocalizedDateTimeFormatting.min.js') }}"></script>
    <script nonce="{{ csp_nonce }}"> moment.locale('en'); </script>


    <script id="modelJson" type="application/json">
        {{ model_json | safe }}
    </script>
    <script src="{{ url_for('static', filename='synapse/jquery-3.6.4.min.js') }}"></script>
    <script src="{{ url_for('static', filename='synapse/encoder.min.js') }}"></script>

    <script src="{{ url_for('static', filename='synapse/login.js') }}"></script>
    <script src="{{ url_for('static', filename='synapse/Logo.js') }}"></script>
</body></html>
