web:
  enabled: true
  templates_dir: fujifilm
  favicon: synapse/favicon.ico
  grant_access: false                            # false = log + deny; true = grant into the decoy worklist
  secure_cookies: true                           # observed HTTPS deployment cookie behavior

  # Real Synapse paths, sourced from public passive recon; response kinds are defined in web/app.py::_HONEYTRAP_RESPONSES.
  honeytraps:
    - path: /Swat/
      response: login_redirect
    - path: /api/WorkflowEngine/
      response: api_404

  # X-Backendserver is site-specific; set it per deployment.
  headers:
    Server: Microsoft-IIS/10.0
    X-Powered-By: ASP.NET
    X-AspNet-Version: 4.0.30319
    X-Frame-Options: SAMEORIGIN
    X-Content-Type-Options: nosniff
    X-Backendserver: SYNWEB01

  # Cache headers applied to HTML pages only (static assets stay cacheable).
  html_cache_headers:
    Cache-Control: "no-store, no-cache, max-age=0, private"
    Pragma: no-cache

  # The observed deployment emits both the modern and legacy CSP header.
  legacy_csp_header: true
  # Keep the {nonce} placeholder — filled per request so inline scripts run.
  content_security_policy: >-
    default-src 'self'; script-src 'nonce-{nonce}' 'self'; style-src 'self' 'unsafe-inline';
    img-src *; report-uri /SynapseSignOn/sts/csp/report

  identity:
    version: "7.4.300"                           # version stamp on the login logo
    copyright: "Copyright © 2024-2025 FUJIFILM Healthcare Americas Corporation. All rights reserved."
    site_name: "Synapse Sign-On"                 # AngularJS model_json's siteName field

  license:                                       # "Licensed to:" block; keep coherent with the seeded institution
    issued: "03/04/2026"
    lines:
      - "SYNAPSE PACS"
      - "RADIOLOGY DEPARTMENT"
      - "1 HOSPITAL WAY"
      - "SPRINGFIELD, 11111"

  oidc:                                          # "Log in with Windows instead" link; values vary by version/deploy
    client_id: synapsebaseclient
    client_name: SynapseBase
    redirect_path: /WorkflowUI/
    scopes: >-
      openid offline_access profile roles privileges usersession culture dbuser
      auth_mode full_name user_domain APService DcmApi ProxyService RPEngine StdApi
      ThinkLogService ViewerService WorkflowEngine SubscriptionService
      ExtApiService XDSConsumerApi FHIRCastHub

  # Bait accounts. No honey hint: the sign-on page is a verbatim capture, so it discloses nothing.
  honey_credentials:
    - username: svc_dicom
      password: svc_dicom
    - username: pacsadmin
      password: Password1

  fingerprint:
    enabled: true

  worklist_page_size: 100

  # Post-login worklist shell; every visible string is profile data, the engine ships none of it.
  worklist:
    title: All Studies with Images
    header_links: ["Messages", "Help", "Settings", "Text Size"]
    columns:
      - {key: patient_name, label: Patient Name}
      - {key: description, label: Proc Description}
      - {key: modality, label: Modality}
      - {key: images, label: Images}
      - {key: patient_id, label: Patient ID}
      - {key: patient_sex, label: Sex}
      - {key: patient_birth_date, label: DOB}
      - {key: age, label: Age}
      - {key: body_part, label: Body Part}
      - {key: study_datetime, label: Study Date Time}
      - {key: accession_number, label: Accession}
      - {key: institution_name, label: Institution}
      - {key: referring_physician, label: Referring}
    # Folder names observed in a deployment; counts are omitted so no badge contradicts real data.
    sidebar:
      - label: My History
      - label: My Favorites
      - label: Global Worklists
        items:
          - {label: All Patients Global}
          - {label: All Recent Studies Global}
          - {label: All Studies Global}
          - {label: Unread Studies Global}
      - label: Worklists
        items:
          - {label: All Patients}
          - {label: All Studies}
          - {label: All Studies with Images}
          - {label: All Reservations}
          - {label: CT, filter: {modality: CT}}
          - {label: CR, filter: {modality: CR}}
      - label: Collections
        items:
          - {label: My Collection}
          - {label: Mammo Samples}
      - label: Public Collections
        items:
          - {label: Matt test}
          - {label: Mammo - Additional Samples}
    context_menu:
      - {label: Open Viewer, result: error}
      - {label: Open PowerJacket, result: error}
      - {label: Open Series Picker, result: error}
      - {label: Study Information, result: detail}
      - {label: Reports, result: error}
      - {label: Notes, result: error}
      - {label: Documents, result: error}
      - {label: Reserve for Me, result: error}
      - {label: DICOM Transfer, result: error}
    footer:
      item_label: items
      refresh_label: Last refreshed
    messages:
      action_failed: The imaging service did not respond. Contact your system administrator.
    placeholders:
      description: UNKNOWN
      status: ""
      empty: ""

  # Synapse paths and cookie names sourced from public passive recon.
  routes:
    entry: /Synapse
    worklist: /WorkflowUI/
    login: /SynapseSignOn/sts/login
    winauth: /SynapseSignOn/WinAuth/Login.aspx
    forgot_password: /ssomgr/password/forgotpassword
    sts_error: /SynapseSignOn/sts/error
    sts_authorize: /SynapseSignOn/sts/connect/authorize
    csp_report: /SynapseSignOn/sts/csp/report
    translated_items: /synapse/error/TranslatedItems
    # Sits in the same asset prefix and namespace as the real scripts, so it doesn't stand out.
    fingerprint_script: /static/synapse/ClientCapabilities.min.js
    fingerprint_ingest: /synapse/error/ClientInfo
  cookies:
    antiforgery: idsrv.xsrf
    session: IdpCookie
    signin_message_prefix: "SignInMessage."
    nonce_prefix: "OpenIdConnect.nonce."
    idp: IdpCookie
    idp_token: IdpTokenCookie
    winlogin_origurl: WinLogin.OrigRequestUrlCookie
  winauth_messages:
    text1: Synapse Log On
    text2: Unable to log in using Windows Authentication.
    text3: Log in directly

# Synapse DICOMweb ports/auth from the public conformance statement.
dicomweb:
  enabled: true
  services:
    - service: wado_uri
      base_path: /services/wado
      port: 9080
    - service: qido
      base_path: /qido-rs
      port: 10080
    - service: wado_rs
      base_path: /wado-rs
      port: 12080
    - service: stow
      base_path: /stow-rs
      port: 13080
  require_auth: [wado_uri, stow]
  qido_default_media_type: application/json
  default_transfer_syntax: 1.2.840.10008.1.2.1
  auth_schemes: [Negotiate, NTLM, Basic]
  qido_warning_agent: Synapse
