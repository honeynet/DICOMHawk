# Source: Synapse DICOM Conformance Statement DOC-0062366-A, SW 7.4.2+, 2024-09-06; syntax sets are Table 1-3 unions.
_ts_verification: &ts_verification         # Table 1-5: Implicit + Explicit VR LE only
  - 1.2.840.10008.1.2           # Implicit VR Little Endian
  - 1.2.840.10008.1.2.1         # Explicit VR Little Endian
_ts_qr_find: &ts_qr_find                   # "LEI" — Q/R FIND SCP: Implicit VR LE only
  - 1.2.840.10008.1.2
_ts_qr_move_get: &ts_qr_move_get           # "LEI, LEE" — Q/R MOVE/GET SCP
  - 1.2.840.10008.1.2
  - 1.2.840.10008.1.2.1
_ts_storage_llu: &ts_storage_llu           # Table 1-1 group "LL, L, U"
  - 1.2.840.10008.1.2.4.70      # JPEG Lossless, Nonhierarchical, Process 14 (SV1)
  - 1.2.840.10008.1.2.4.90      # JPEG 2000 Image Compression (Lossless Only)
  - 1.2.840.10008.1.2.4.50      # JPEG Baseline (Process 1)
  - 1.2.840.10008.1.2.4.91      # JPEG 2000 Image Compression
  - 1.2.840.10008.1.2           # Implicit VR Little Endian
  - 1.2.840.10008.1.2.1         # Explicit VR Little Endian
  - 1.2.840.10008.1.2.2         # Explicit VR Big Endian
_ts_storage_lluR: &ts_storage_lluR         # Table 1-1 group "LL, L, U, R"
  - 1.2.840.10008.1.2.4.70
  - 1.2.840.10008.1.2.4.90
  - 1.2.840.10008.1.2.4.50
  - 1.2.840.10008.1.2.4.91
  - 1.2.840.10008.1.2
  - 1.2.840.10008.1.2.1
  - 1.2.840.10008.1.2.2
  - 1.2.840.10008.1.2.5         # RLE Lossless
_ts_storage_u: &ts_storage_u               # Table 1-1 group "U"
  - 1.2.840.10008.1.2
  - 1.2.840.10008.1.2.1
  - 1.2.840.10008.1.2.2
_ts_storage_uu: &ts_storage_uu             # Table 1-1 group "UU" (RT Dose Storage only)
  - 1.2.840.10008.1.2
  - 1.2.840.10008.1.2.1

meta:
  name: fujifilm
  kind: pacs

identity:
  ae_title: SYNAPSEDICOMSCP                                 
  implementation_class_uid: 1.2.840.113845.1.1              
  implementation_version_name: "Syn7,3,0,1"                 
  manufacturer: FUJIFILM Healthcare Americas Corporation
  model_name: Synapse PACS

dicom:
  operations: [echo, find, get, move, store]
  max_associations: 16     
  max_pdu_size: 65000      
  ae_auth:
    require_called_aet: false   
    require_calling_aet: null

  verification:
    uid: 1.2.840.10008.1.1
    transfer_syntaxes: *ts_verification

  qr_classes:
    find:
      - uid: 1.2.840.10008.5.1.4.1.2.1.1     # Patient Root Q/R Information Model – FIND
        transfer_syntaxes: *ts_qr_find
      - uid: 1.2.840.10008.5.1.4.1.2.2.1     # Study Root Q/R Information Model – FIND
        transfer_syntaxes: *ts_qr_find
      - uid: 1.2.840.10008.5.1.4.1.2.3.1     # Patient/Study Only Q/R Information Model – FIND, retired
        transfer_syntaxes: *ts_qr_find
    move:
      - uid: 1.2.840.10008.5.1.4.1.2.1.2     # Patient Root Q/R Information Model – MOVE
        transfer_syntaxes: *ts_qr_move_get
      - uid: 1.2.840.10008.5.1.4.1.2.2.2     # Study Root Q/R Information Model – MOVE
        transfer_syntaxes: *ts_qr_move_get
      - uid: 1.2.840.10008.5.1.4.1.2.3.2     # Patient/Study Only Q/R Information Model – MOVE, retired
        transfer_syntaxes: *ts_qr_move_get
      - uid: 1.2.840.10008.5.1.4.1.2.4.2     # Composite Instance Root Retrieve – MOVE
        transfer_syntaxes: *ts_qr_move_get
    get:
      - uid: 1.2.840.10008.5.1.4.1.2.2.3     # Study Root Q/R Information Model – GET
        transfer_syntaxes: *ts_qr_move_get
      - uid: 1.2.840.10008.5.1.4.1.2.4.3     # Composite Instance Root Retrieve – GET
        transfer_syntaxes: *ts_qr_move_get
      - uid: 1.2.840.10008.5.1.4.1.2.5.3     # Composite Instance Retrieve Without Bulk Data – GET
        transfer_syntaxes: *ts_qr_move_get

  # Table 1-1 Storage SCP subset (~77 classes) — NOT AllStoragePresentationContexts.
  storage_classes:
    # --- accepted TS set "LL, L, U" ---
    - uid: 1.2.392.200036.9125.1.1.2                # Fuji Private CR Storage (FujiCR)
      transfer_syntaxes: *ts_storage_llu
