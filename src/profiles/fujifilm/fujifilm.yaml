      transfer_syntaxes: *ts_storage_llu
    - uid: 1.2.840.10008.5.1.4.1.1.1.2               # Digital Mammography X-Ray Image Storage – For Presentation
      transfer_syntaxes: *ts_storage_llu
    - uid: 1.2.840.10008.5.1.4.1.1.1.2.1             # Digital Mammography X-Ray Image Storage – For Processing
      transfer_syntaxes: *ts_storage_llu
    - uid: 1.2.840.10008.5.1.4.1.1.1.3               # Digital Intra-Oral X-Ray Image Storage – For Presentation
      transfer_syntaxes: *ts_storage_llu
    - uid: 1.2.840.10008.5.1.4.1.1.1.3.1             # Digital Intra-Oral X-Ray Image Storage – For Processing
      transfer_syntaxes: *ts_storage_llu
