services:
  dicomhawk:
    build: .
    image: dicomhawk:latest
    container_name: dicomhawk
    restart: unless-stopped
    tty: true   # pseudo-TTY so the server's stdout is a terminal → colored `docker logs`
    env_file:
      - .env
    ports:
      - "104:104"               # standard unencrypted DICOM port; use host privileges/capabilities as required
      - "8080:8080"             # attacker-facing web (pacs profiles with web.enabled only)
      - "127.0.0.1:8081:8081"   # container binds 0.0.0.0; host stays loopback-only
      # Publish every profile port; only the active profile listens.
      - "8042:8042"             # DICOMweb generic / Orthanc-shaped profile
      - "9080:9080"             # DICOMweb WADO-URI  (fujifilm)
      - "10080:10080"           # DICOMweb QIDO-RS   (fujifilm)
      - "12080:12080"           # DICOMweb WADO-RS   (fujifilm)
      - "13080:13080"           # DICOMweb STOW-RS   (fujifilm)
    command:
      - dicomhawk
      - serve
      - --profile
      - "${DICOMHAWK_PROFILE:-}"        # empty = generic default; e.g. "fujifilm" or a mounted /path.yaml
      - -p
      - "${DICOMHAWK_PORTS:-104}"
      - -ae
      - "${DICOMHAWK_AE_TITLE:-}"       # empty = use the profile's AE title; set to override it
      - -db
      - "${DICOMHAWK_DB:-/opt/dicomhawk/storage/dicomhawk.db}"
      - -t
      - "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}"
      - -l
      - /var/log/dicomhawk/dicomhawk.log
      - --web-port
      - "${DICOMHAWK_WEB_PORT:-8080}"
      - --operator-port
      - "${DICOMHAWK_OPERATOR_PORT:-8081}"
      - --operator-host
      - "${DICOMHAWK_OPERATOR_HOST:-0.0.0.0}"
      - --allow-remote-operator
      - -v
    volumes:
      - dicom_storage:${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}
      - logs:/var/log/dicomhawk
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,socket; p=int(os.environ.get('DICOMHAWK_PORTS','104').split(',')[0]); s=socket.create_connection(('127.0.0.1',p),2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dicomhawk_net

volumes:
  dicom_storage:
  logs:

networks:
  dicomhawk_net:
    driver: bridge
