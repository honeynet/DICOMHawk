services:
  # Main Stack Services (profile: main)
  logserver:
    profiles: ["main"]
    build: ./flask_logging_server/.
    volumes:
      - ./flask_logging_server/templates:/log_server/templates
      - ./flask_logging_server/static:/log_server/static
      - shared_data:/app
    environment:
      - Docker_ENV=True
    networks:
      main_network:
        ipv4_address: 172.29.0.5
    ports:
      - "5000:5000"

  api:
    profiles: ["main"]
    build: ./API/.
    volumes:
      - shared_data:/app
    networks:
      main_network:
        ipv4_address: 172.29.0.2
    ports:
      - "3000:3000"
    environment:
      - Docker_ENV=True
      - ABUSE_IP_API_KEY=APIKEY
      - IP_QUALITY_SCORE_API_KEY=APIKEY
      - VIRUS_TOTAL_API_KEY=APIKEY

  redis:
    profiles: ["main"]
    image: redis
    ports:
      - "6379:6379"
    networks:
      main_network:
        ipv4_address: 172.29.0.4

  dicom_server:
    profiles: ["main"]
    environment:
      - PROD=yes
      - FLASK_ACTIVATED=yes
      - BLOCK_SCANNERS=no
      - INTEGRITY_CHECK=yes
      - TCIA_ACTIVATED=yes
      - BLACKHOLE_FILE_PATH=./storage/blackhole_list.txt
      - REDIS_HOST=172.29.0.4
      - TCIA_USER_NAME= TCIA username
      - TCIA_PASSWORD= TCIA pass
      - TCIA_PERIOD_UNIT=week
      - TCIA_PERIOD=1
      - ABUSE_IP_API_KEY= APIKEY
      - IP_QUALITY_SCORE_API_KEY= APIKEY
      - VIRUS_TOTAL_API_KEY= APIKEY
      - MODALITIES=["CT", "MR", "US", "DX"]
      - MINIMUM_TCIA_FILES_IN_SERIE=1
      - MAXIMUM_TCIA_FILES_IN_SERIE=3
      - TCIA_STUDIES_PER_MODALITY=10
      - DOCKER=yes
      - HONEY_URL="https://[YOURHONEYURL]"
      - DICOM_PORTS=[11112, 104, 4242, 3702, 8889, 3389, 80, 135, 5985]
    build: ./dicom_server/.
    volumes:
      - shared_data:/app
    ports:
      - "104:11112"
      - "1112:1112"
      - "4242:4242"
      - "3702:3702"
      - "8889:8889"
      - "3389:3389"
      - "80:80"
      - "135:135"
      - "5985:5985"
    depends_on:
      - redis
    networks:
      main_network:
        ipv4_address: 172.29.0.3

  # Monitoring Stack Services (profile: monitoring)
  logstash:
    profiles: ["monitoring"]
    image: 6711/logstash3:1.0.0
    environment:
      REDIS_HOST: "172.29.0.4"
    entrypoint: ["/bin/bash", "/sub.sh"]
    depends_on:
      - elastiksearch
    networks:
      monitoring_network:
        ipv4_address: 172.18.0.2
      main_network:
        ipv4_address: 172.29.0.6

  elastiksearch:
    profiles: ["monitoring"]
    image: 6711/elasticsearch
    entrypoint: ["/bin/bash", "/entry.sh"]
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      monitoring_network:
        ipv4_address: 172.18.0.3

  kibana:
    profiles: ["monitoring"]
    image: 6711/kibana
    depends_on:
      - elastiksearch
    ports:
      - "5601:5601"
    networks:
      monitoring_network:
        ipv4_address: 172.18.0.4

volumes:
  shared_data:
    driver: local

networks:
  main_network:
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
  monitoring_network:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
