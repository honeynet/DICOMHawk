services:
  dicomhawk:
    build: .
    image: dicomhawk:latest
    container_name: dicomhawk
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DICOMHAWK_PORT_PRIMARY:-11112}:11112"
      - "${DICOMHAWK_PORT_SECONDARY:-1104}:104"
    command:
      - dicomhawk
      - serve
      - -p
      - "104,11112"
      - -ae
      - "${DICOMHAWK_AE_TITLE:-ORTHANC}"
      - -t
      - /opt/dicomhawk/storage
      - -l
      - /var/log/dicomhawk/dicomhawk.log
    volumes:
      - dicom_storage:/opt/dicomhawk/storage
      - logs:/var/log/dicomhawk
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 11112)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dicomhawk_net

volumes:
  dicom_storage:
  logs:

networks:
  dicomhawk_net:
    driver: bridge
