services:
  dicomhawk:
    build: .
    image: dicomhawk:latest
    container_name: dicomhawk
    restart: unless-stopped
    tty: true   # pseudo-TTY so the server's stdout is a terminal → colored `docker logs`
    env_file:
      - .env
    environment:
      DICOMHAWK_PROFILE: "${DICOMHAWK_PROFILE:-}"
      DICOMHAWK_AE_TITLE: "${DICOMHAWK_AE_TITLE:-}"
      DICOMHAWK_PORTS: "${DICOMHAWK_PORTS:-104}"
    ports:
      - "104:104"               # standard unencrypted DICOM port; use host privileges/capabilities as required
      - "8080:8080"             # attacker-facing web (pacs profiles with web.enabled only)
      - "127.0.0.1:8081:8081"   # container binds 0.0.0.0; host stays loopback-only
      # Publish every profile port; only the active profile listens.
      - "8042:8042"             # DICOMweb generic / Orthanc-shaped profile
      - "9080:9080"             # DICOMweb WADO-URI  (fujifilm)
      - "10080:10080"           # DICOMweb QIDO-RS   (fujifilm)
      - "12080:12080"           # DICOMweb WADO-RS   (fujifilm)
      - "13080:13080"           # DICOMweb STOW-RS   (fujifilm)
    command:
      - dicomhawk
      - serve
      - --profile
      - "${DICOMHAWK_PROFILE:-}"        # empty = generic default; e.g. "fujifilm" or a mounted /path.yaml
      - -p
      - "${DICOMHAWK_PORTS:-104}"
      - -ae
      - "${DICOMHAWK_AE_TITLE:-}"       # empty = use the profile's AE title; set to override it
      - -db
      - "${DICOMHAWK_DB:-/opt/dicomhawk/state/dicomhawk.db}"   # own volume, off the flood-prone traces volume
      - -t
      - "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}"
      - -l
      - /var/log/dicomhawk/dicomhawk.log
      - --web-port
      - "${DICOMHAWK_WEB_PORT:-8080}"
      - --operator-port
      - "${DICOMHAWK_OPERATOR_PORT:-8081}"
      - --operator-host
      - "${DICOMHAWK_OPERATOR_HOST:-0.0.0.0}"
      - --allow-remote-operator
      - --trusted-proxy
      - "${DICOMHAWK_TRUSTED_PROXY:-}"
      - -v
    volumes:
      # DB on its own volume so a store-flood filling traces can't break indexing (see docs/deployment.md).
      - dicom_storage:${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}
      - dicom_state:/opt/dicomhawk/state
      - logs:/var/log/dicomhawk
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    # Let the non-root process bind privileged port 104 (Docker won't make CAP_NET_BIND_SERVICE ambient).
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Bound a connection/PDU flood so it can't OOM or fd-exhaust the host. Tune per host.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    stop_grace_period: 45s
    healthcheck:
      # Profile-aware, unlogged loopback C-ECHO proves the DIMSE handler serves, not just the socket.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,logging; logging.disable(logging.CRITICAL);
          from profiles.profile import load_profile;
          from pynetdicom import AE; from pynetdicom.sop_class import Verification;
          prof=load_profile(os.environ.get('DICOMHAWK_PROFILE') or None);
          p=int(os.environ.get('DICOMHAWK_PORTS','104').split(',')[0]);
          allowed=prof.dicom.ae_auth.require_calling_aet;
          ae=AE(ae_title=allowed[0] if allowed else 'HEALTHCHK');
          ae.implementation_version_name='DICOMHAWK_HC'; ae.add_requested_context(Verification);
          called=os.environ.get('DICOMHAWK_AE_TITLE') or prof.ae_title;
          a=ae.associate('127.0.0.1',p,ae_title=called);
          ok=a.is_established and a.send_c_echo().Status==0;
          a.is_established and a.release(); sys.exit(0 if ok else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dicomhawk_net

volumes:
  dicom_storage:
  dicom_state:
  logs:

networks:
  dicomhawk_net:
    # Externally routable (attackers need inbound); drop egress at the host firewall, not via
    # `internal: true` which also breaks the published-port return path. See docs/deployment.md.
    driver: bridge
