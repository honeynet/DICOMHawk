# env_file hands every service the whole .env, so the token is blanked here and restored below.
x-env: &env
  DICOMHAWK_PROFILE: "${DICOMHAWK_PROFILE:-}"
  DICOMHAWK_AE_TITLE: "${DICOMHAWK_AE_TITLE:-}"
  DICOMHAWK_CACHE_DIR: /opt/dicomhawk/state/cache
  DICOMHAWK_PORTS: "${DICOMHAWK_PORTS:-104}"
  DICOMHAWK_OPERATOR_TOKEN: ""

x-common: &common
  build: .
  image: dicomhawk:latest
  restart: unless-stopped
  env_file: [.env]
  environment: *env
  volumes:
    - dicom_storage:${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}
    - dicom_state:/opt/dicomhawk/state
    - ${DICOMHAWK_DATA_DIR:-./data/dicomhawk}/logs:/var/log/dicomhawk
    - ${DICOMHAWK_DATA_DIR:-./data/dicomhawk}/profiles:/opt/dicomhawk/profiles:ro
  tmpfs: ["/tmp:size=128m,mode=1777,noexec,nosuid,nodev"]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  memswap_limit: 512m
  pids_limit: 192
  cpus: 1.0
  ulimits:
    nofile: {soft: 1024, hard: 2048}
  stop_grace_period: 45s
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "5"}
  networks: [dicomhawk_net]

services:
  dimse:
    <<: *common
    container_name: dicomhawk-dimse
    command: [dicomhawk, serve, --service, dimse, --profile, "${DICOMHAWK_PROFILE:-}", -p, "${DICOMHAWK_PORTS:-104}", -ae, "${DICOMHAWK_AE_TITLE:-}", -db, "${DICOMHAWK_DB:-/opt/dicomhawk/state/dicomhawk.db}", --analysis-db, "${DICOMHAWK_ANALYSIS_DB:-/opt/dicomhawk/state/analysis.db}", -t, "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}", -l, /var/log/dicomhawk/dicomhawk.log, -v]
    ports: ["104:104"]
    sysctls: [net.ipv4.ip_unprivileged_port_start=0]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,logging; logging.disable(logging.CRITICAL);
          from profiles.profile import load_profile;
          from pynetdicom import AE; from pynetdicom.sop_class import Verification;
          prof=load_profile(os.environ.get('DICOMHAWK_PROFILE') or None);
          p=int(os.environ.get('DICOMHAWK_PORTS','104').split(',')[0]);
          allowed=prof.dicom.ae_auth.require_calling_aet;
          ae=AE(ae_title=allowed[0] if allowed else 'HEALTHCHK');
          ae.implementation_version_name='DICOMHAWK_HC'; ae.add_requested_context(Verification);
          called=os.environ.get('DICOMHAWK_AE_TITLE') or prof.ae_title;
          a=ae.associate('127.0.0.1',p,ae_title=called);
          ok=a.is_established and a.send_c_echo().Status==0;
          a.is_established and a.release(); sys.exit(0 if ok else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    <<: *common
    container_name: dicomhawk-web
    command: [dicomhawk, serve, --service, web, --profile, "${DICOMHAWK_PROFILE:-}", -db, "${DICOMHAWK_DB:-/opt/dicomhawk/state/dicomhawk.db}", --analysis-db, "${DICOMHAWK_ANALYSIS_DB:-/opt/dicomhawk/state/analysis.db}", --fingerprint-db, "${DICOMHAWK_FINGERPRINT_DB:-/opt/dicomhawk/state/fingerprint.db}", -t, "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}", -l, /var/log/dicomhawk/dicomhawk.log, --web-port, "${DICOMHAWK_WEB_PORT:-8080}", --trusted-proxy, "${DICOMHAWK_TRUSTED_PROXY:-}", -v]
    ports: ["8080:8080"]

  operator:
    <<: *common
    container_name: dicomhawk-operator
    environment:
      <<: *env
      DICOMHAWK_OPERATOR_TOKEN: "${DICOMHAWK_OPERATOR_TOKEN:-}"
    # Own bridge: it binds 0.0.0.0 so Docker can publish it, and no peer needs to reach it.
    networks: [dicomhawk_operator_net]
    command: [dicomhawk, serve, --service, operator, --profile, "${DICOMHAWK_PROFILE:-}", -db, "${DICOMHAWK_DB:-/opt/dicomhawk/state/dicomhawk.db}", --analysis-db, "${DICOMHAWK_ANALYSIS_DB:-/opt/dicomhawk/state/analysis.db}", --fingerprint-db, "${DICOMHAWK_FINGERPRINT_DB:-/opt/dicomhawk/state/fingerprint.db}", -t, "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}", -l, /var/log/dicomhawk/dicomhawk.log, --operator-port, "${DICOMHAWK_OPERATOR_PORT:-8081}", --operator-host, "${DICOMHAWK_OPERATOR_HOST:-0.0.0.0}", --allow-remote-operator, -v]
    ports: ["127.0.0.1:8081:8081"]

  dicomweb:
    <<: *common
    container_name: dicomhawk-dicomweb
    command: [dicomhawk, serve, --service, dicomweb, --profile, "${DICOMHAWK_PROFILE:-}", -db, "${DICOMHAWK_DB:-/opt/dicomhawk/state/dicomhawk.db}", --analysis-db, "${DICOMHAWK_ANALYSIS_DB:-/opt/dicomhawk/state/analysis.db}", -t, "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}", -l, /var/log/dicomhawk/dicomhawk.log, --trusted-proxy, "${DICOMHAWK_TRUSTED_PROXY:-}", -v]
    ports: ["8042:8042", "9080:9080", "10080:10080", "12080:12080", "13080:13080"]

  analysis:
    <<: *common
    container_name: dicomhawk-analysis
    command: [dicomhawk, serve, --service, analysis, --profile, "${DICOMHAWK_PROFILE:-}", -db, "${DICOMHAWK_DB:-/opt/dicomhawk/state/dicomhawk.db}", --analysis-db, "${DICOMHAWK_ANALYSIS_DB:-/opt/dicomhawk/state/analysis.db}", -t, "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}", -l, /var/log/dicomhawk/dicomhawk.log, -v]

volumes:
  dicom_storage:
  dicom_state:

networks:
  dicomhawk_net:
    driver: bridge
  dicomhawk_operator_net:
    driver: bridge
