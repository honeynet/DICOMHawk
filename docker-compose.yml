services:
  dicomhawk:
    build: .
    image: dicomhawk:latest
    container_name: dicomhawk
    restart: unless-stopped
    tty: true   # pseudo-TTY so the server's stdout is a terminal → colored `docker logs`
    env_file:
      - .env
    ports:
      - "11112:11112"
      - "1104:104"
    command:
      - dicomhawk
      - serve
      - --profile
      - "${DICOMHAWK_PROFILE:-}"        # empty = generic default; e.g. "fujifilm" or a mounted /path.yaml
      - -p
      - "${DICOMHAWK_PORTS:-104,11112}"
      - -ae
      - "${DICOMHAWK_AE_TITLE:-}"       # empty = use the profile's AE title; set to override it
      - -db
      - "${DICOMHAWK_DB:-/opt/dicomhawk/storage/dicomhawk.db}"
      - -t
      - "${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}"
      - -l
      - /var/log/dicomhawk/dicomhawk.log
      - -v
    volumes:
      - dicom_storage:${DICOMHAWK_TRACES:-/opt/dicomhawk/storage}
      - logs:/var/log/dicomhawk
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 11112)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dicomhawk_net

volumes:
  dicom_storage:
  logs:

networks:
  dicomhawk_net:
    driver: bridge
