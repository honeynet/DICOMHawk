services:
  # Main Stack Services (profile: main)
  logserver:
    profiles: ["main"]
    build: ./flask_logging_server/.
    volumes:
      - ./flask_logging_server/templates:/log_server/templates
      - ./flask_logging_server/static:/log_server/static
      - ./data/dicomhawk/logs:/var/log/dicomhawk
    environment:
      - Docker_ENV=True
    networks:
      main_network:
        ipv4_address: 172.29.0.5
    ports:
      - "5000:5000"

  api:
    profiles: ["main"]
    build: ./API/.
    volumes:
      - ./data/dicomhawk/logs:/var/log/dicomhawk
      - ./dicom_server/storage:/opt/dicomhawk/storage
    networks:
      main_network:
        ipv4_address: 172.29.0.2
    ports:
      - "3702:3702"
    environment:
      - Docker_ENV=True
      - ABUSE_IP_API_KEY=APIKEY
      - IP_QUALITY_SCORE_API_KEY=APIKEY
      - VIRUS_TOTAL_API_KEY=APIKEY
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - ADMIN_REFRESH_TOKEN_SECRET=${ADMIN_REFRESH_TOKEN_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - API_PORT=${API_PORT}

  redis:
    profiles: ["main"]
    image: redis
    ports:
      - "6379:6379"
    networks:
      main_network:
        ipv4_address: 172.29.0.4

  dicom_server:
    profiles: ["main"]
    environment:
      - PROD=yes
      - FLASK_ACTIVATED=yes
      - BLOCK_SCANNERS=no
      - INTEGRITY_CHECK=yes
      - TCIA_ACTIVATED=yes
      - BLACKHOLE_FILE_PATH=/opt/dicomhawk/storage/blackhole_list.txt
      - REDIS_HOST=172.29.0.4
      - TCIA_USER_NAME=${TCIA_USER_NAME}
      - TCIA_PASSWORD=${TCIA_PASSWORD}
      - TCIA_PERIOD_UNIT=minutes
      - TCIA_PERIOD=1
      - FAKER_LOCALE=${FAKER_LOCALE}
      - OSM_ENABLED=${OSM_ENABLED:-true}
      - OSM_COUNTRY=${OSM_COUNTRY:-DK}
      - OSM_CITY=${OSM_CITY:-}
      - OSM_CACHE_DURATION=${OSM_CACHE_DURATION:-24}
      - OSM_MAX_INSTITUTIONS=${OSM_MAX_INSTITUTIONS:-50}
      - OSM_TIMEOUT=${OSM_TIMEOUT:-30}
      - OSM_FALLBACK_INSTITUTIONS=${OSM_FALLBACK_INSTITUTIONS:-["Københavns Sundhedscenter", "Aarhus Kliniken", "Odense Patienthus", "Nordjylland Med Institut"]}
      - ABUSE_IP_API_KEY=${ABUSE_IP_API_KEY}
      - IP_QUALITY_SCORE_API_KEY=${IP_QUALITY_SCORE_API_KEY}
      - VIRUS_TOTAL_API_KEY=${VIRUS_TOTAL_API_KEY}
      - MODALITIES=["CT", "MR", "US", "DX"]
      - MINIMUM_TCIA_FILES_IN_SERIE=1
      - MAXIMUM_TCIA_FILES_IN_SERIE=3
      - TCIA_STUDIES_PER_MODALITY=10
      - DOCKER=yes
      - HONEY_URL="https://[YOURHONEYURL]"
      - DICOM_PORTS=${DICOM_PORTS}
      - DICOM_IMPLEMENTATION_NAME=${DICOM_IMPLEMENTATION_NAME}
      - DICOM_IMPLEMENTATION_UID=${DICOM_IMPLEMENTATION_UID}

    build: ./dicom_server/.
    volumes:
      - ./data/dicomhawk/logs:/var/log/dicomhawk
      - ./data/dicomhawk/db:/opt/dicomhawk/db
      - ./dicom_server/storage:/opt/dicomhawk/storage
      - ./dicom_server/storage/tcia_data:/opt/dicomhawk/tcia/data
      - ./dicom_server/storage/stagger:/opt/dicomhawk/tcia/stagger
    ports:
      - "11112:11112"
    depends_on:
      - redis
    networks:
      main_network:
        ipv4_address: 172.29.0.3

  dicomhawkinit:
    profiles: ["main"]
    container_name: dicomhawkinit
    build: ./dicomhawkinit/.
    restart: always
    environment:
      - PERSISTENCE_CYCLES=30
    volumes:
      - ./data:/data
    networks:
      main_network:
        ipv4_address: 172.29.0.7

  # Monitoring Stack Services (profile: monitoring)
  logstash:
    profiles: ["monitoring"]
    image: 6711/logstash3:1.0.0
    entrypoint: ["/bin/bash", "/sub.sh"]
    volumes:
      - ./data:/data
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elastiksearch
    networks:
      monitoring_network:
        ipv4_address: 172.18.0.2
      main_network:
        ipv4_address: 172.29.0.6

  elastiksearch:
    profiles: ["monitoring"]
    image: 6711/elasticsearch
    entrypoint: ["/bin/bash", "/entry.sh"]
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      monitoring_network:
        ipv4_address: 172.18.0.3

  kibana:
    profiles: ["monitoring"]
    image: 6711/kibana
    depends_on:
      - elastiksearch
    ports:
      - "5601:5601"
    networks:
      monitoring_network:
        ipv4_address: 172.18.0.4

volumes:
  shared_data:
    driver: local

networks:
  main_network:
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
  monitoring_network:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
