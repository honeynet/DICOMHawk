[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicomhawk"
version = "0.1.0"
description = "DICOM honeypot"
authors = [
    {name = "Georgios Theodoridis"}
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydicom==3.0.2",
    "pynetdicom==3.0.4",
    "pylibjpeg==2.1.0",
    "pylibjpeg-libjpeg==2.4.0",
    "pylibjpeg-openjpeg==2.5.0",
    "requests==2.33.1",
    "redis==7.4.0",
    "schedule==1.2.2",
    "jwt==1.4.0",
    "dependency-injector==4.49.0",
    "aenum==3.1.17",
    "pytz==2026.1.post1",
    "overpy==0.7",
    "sqlalchemy==2.0.48",
    "typer==0.24.1",
    "numpy==2.4.4",
    # for the web
    "flask==3.1.3",
    "ujson==5.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "faker==40.12.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dicomhawk", "dicomhawk.*", "commands", "commands.*", "web", "web.*"]

[project.urls]
Homepage = "https://github.com/honeynet/DICOMHawk"
Issues = "https://github.com/honeynet/DICOMHawk/issues"

[project.scripts]
dicomhawk = "commands.main:main"