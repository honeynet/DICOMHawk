[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicomhawk"
version = "0.1.0"
description = "DICOM honeypot"
authors = [
    {name = "Georgios Theodoridis"}
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydicom>=3.0,<4",
    "pynetdicom>=3.0,<4",
    "numpy>=1.26,<3",
    "pylibjpeg>=2.0,<3",
    "pylibjpeg-libjpeg>=2.0,<3",
    "pylibjpeg-openjpeg>=2.0,<3",
    "pillow>=11,<13",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.15,<1",
    "pyyaml>=6,<7",
    # for the web
    "flask>=3.0,<4",
    "waitress>=3.0,<4",
    "ujson>=5.0,<6",
    "faker>=30,<50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "black>=24",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dicomhawk", "dicomhawk.*", "commands", "commands.*", "seeding", "seeding.*", "profiles", "profiles.*", "web", "web.*", "honeytoken", "honeytoken.*"]

[tool.setuptools.package-data]
seeding = ["fallback_data/**/*.dcm", "fallback_data/**/ATTRIBUTION.md", "config.yaml"]
profiles = ["*/*.yaml", "*/web/templates/*.html", "*/web/static/**/*"]

[project.urls]
Homepage = "https://github.com/honeynet/DICOMHawk"
Issues = "https://github.com/honeynet/DICOMHawk/issues"

[project.scripts]
dicomhawk = "commands.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
